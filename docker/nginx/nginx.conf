user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 60M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Resolve upstream hostnames via Docker's embedded DNS at request time so
    # nginx does not cache a container IP forever. Without this, recreating the
    # backend/frontend containers (which changes their IP) makes nginx keep
    # connecting to the old, dead IP and return 502 Connection refused.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # --- Let's Encrypt ACME challenge (must be served over plain HTTP) ---
        # Certbot (webroot mode) drops the challenge files here; this location
        # must be matched BEFORE the catch-all `location /` so the request is
        # served from disk instead of being proxied to the frontend (404).
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # --- Backend API + docs ---
        # Using a variable in proxy_pass forces nginx to re-resolve the hostname
        # through the `resolver` above instead of pinning the IP at startup.
        # With a variable, nginx no longer appends the URI automatically, so we
        # pass $request_uri explicitly to preserve the full path + query.
        location /api/   { set $backend  backend:8000; proxy_pass http://$backend$request_uri;  include /etc/nginx/proxy_params.conf; }
        location /docs   { set $backend  backend:8000; proxy_pass http://$backend$request_uri;  include /etc/nginx/proxy_params.conf; }
        location /redoc  { set $backend  backend:8000; proxy_pass http://$backend$request_uri;  include /etc/nginx/proxy_params.conf; }
        location /health { set $backend  backend:8000; proxy_pass http://$backend$request_uri;  include /etc/nginx/proxy_params.conf; }

        # --- Uploaded media (served directly) ---
        location /media/ {
            alias /data/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # --- Frontend (everything else) ---
        location / { set $frontend frontend:3000; proxy_pass http://$frontend$request_uri; include /etc/nginx/proxy_params.conf; }
    }

    # HTTPS server (enabled after certbot provisions certificates).
    # server {
    #     listen 443 ssl http2;
    #     server_name admin.sonews.ru;
    #     ssl_certificate     /etc/letsencrypt/live/admin.sonews.ru/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/admin.sonews.ru/privkey.pem;
    #     include /etc/nginx/proxy_params.conf;
    #     location /api/ { proxy_pass http://backend; }
    #     location /     { proxy_pass http://frontend; }
    # }
}
