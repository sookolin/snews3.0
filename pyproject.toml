[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citynews"
version = "3.0.0"
description = "City news monitoring, AI processing and Telegram publishing platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CityNews Team" }]

dependencies = [
    # Web / API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    # Redis / queues
    "redis>=5.2.0",
    "celery>=5.4.0",
    "flower>=2.0.1",
    # Settings / validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    # Security
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "pyotp>=2.9.0",
    "itsdangerous>=2.2.0",
    # HTTP / parsing
    "httpx>=0.27.2",
    "aiohttp>=3.10.10",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "playwright>=1.48.0",
    # Telegram
    "aiogram>=3.13.0",
    # Scheduling
    "apscheduler>=3.10.4",
    # AI providers
    "anthropic>=0.39.0",
    "openai>=1.54.0",
    "google-generativeai>=0.8.3",
    # Dedup / NLP
    "rapidfuzz>=3.10.0",
    "simhash>=2.1.2",
    "numpy>=1.26.0",
    "pymorphy3>=2.0.2",
    # Media / watermark
    "Pillow>=11.0.0",
    # Web Push (PWA / iOS home-screen notifications)
    "pywebpush>=2.0.0",
    "py-vapid>=1.9.1",
    # Monitoring (CPU/memory for the Очередь и мониторинг page)
    "psutil>=6.1.0",
    # Utils
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "python-slugify>=8.0.4",
    "orjson>=3.10.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "types-python-slugify",
]

[tool.setuptools]
packages = ["shared", "backend", "telegram_bot", "workers"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
# B008: FastAPI Depends() in defaults is idiomatic.
# N805: false positives on pydantic validators.
# UP017: keep timezone.utc for 3.10 compatibility.
# UP042: str-Enum mix is intentional for JSON serialisation.
# ASYNC22x/23x/24x: intentional sync I/O offloaded via asyncio.to_thread or in short admin paths.
ignore = ["B008", "N805", "UP017", "UP042", "ASYNC230", "ASYNC240", "ASYNC221"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
